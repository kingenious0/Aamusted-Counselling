{% set active_page = 'intake' %}
{% extends 'base.html' %}
{% block title %}New Client Intake - AAMUSTED Counselling{% endblock %}
{% block heading %}<i class="fas fa-user-plus me-2" style="color:#4ade80"></i>New Client Intake{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card-dark">
            <form method="POST" action="/intake">
                <h3 style="margin-bottom:20px;"><i class="fas fa-id-card me-2" style="color:#60a5fa"></i>Personal Information</h3>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label">First Name *</label>
                        <input type="text" name="first_name" class="form-control" required placeholder="First name">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Last Name *</label>
                        <input type="text" name="last_name" class="form-control" required placeholder="Last name">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Student ID *</label>
                        <input type="text" name="student_id" class="form-control" required placeholder="10-digit ID">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="student@email.com">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Phone</label>
                        <input type="text" name="phone" class="form-control" placeholder="Phone number">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Gender *</label>
                        <select name="gender" class="form-select" required>
                            <option value="">Select...</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Program *</label>
                        <input type="text" name="program" class="form-control" required placeholder="e.g. B.Sc. IT">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Level *</label>
                        <select name="level" class="form-select" required>
                            <option value="">Select Level...</option>
                            <option value="100">100</option>
                            <option value="200">200</option>
                            <option value="300">300</option>
                            <option value="400">400</option>
                        </select>
                    </div>
                </div>

                <h3 style="margin-bottom:20px;"><i class="fas fa-comment-medical me-2" style="color:#fbbf24"></i>Reason for Visit</h3>
                <div class="mb-4">
                    <label class="form-label">Reason for Visit *</label>
                    <textarea name="reason_for_visit" class="form-control" rows="4" required placeholder="Describe the reason for this visit..."></textarea>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="/dashboard" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Register Client</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
