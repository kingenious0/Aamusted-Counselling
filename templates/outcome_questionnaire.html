{% set active_page = 'outcome' %}
{% extends 'base.html' %}
{% block title %}Outcome Questionnaire - AAMUSTED Counselling{% endblock %}
{% block heading %}<i class="fas fa-clipboard-list me-2" style="color:#4ade80"></i>Outcome Questionnaire{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card-dark">
            <form method="POST" action="/outcome_questionnaire">
                <h3 style="margin-bottom:20px;"><i class="fas fa-clipboard-check me-2" style="color:#4ade80"></i>Assessment Details</h3>
                <div class="row g-3 mb-4">
                    <div class="col-md-12">
                        <label class="form-label">Student *</label>
                        <select name="student_id" class="form-select" required>
                            <option value="">Select Student...</option>
                            {% for s in students %}
                            <option value="{{ s.id }}">{{ s.name }} ({{ s.case_number }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Session</label>
                        <select name="session_id" class="form-select">
                            <option value="">Select Session...</option>
                            {% for s in sessions %}
                            <option value="{{ s.id }}">{{ s.student_name }} - {{ s.date }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Date</label>
                        <input type="date" name="date" class="form-control">
                    </div>
                </div>

                <h3 style="margin-bottom:20px;"><i class="fas fa-chart-line me-2" style="color:#60a5fa"></i>Outcome Scores</h3>
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <label class="form-label">Depression Score (0-21)</label>
                        <input type="number" name="depression" class="form-control" min="0" max="21" step="0.5" placeholder="0">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Anxiety Score (0-21)</label>
                        <input type="number" name="anxiety" class="form-control" min="0" max="21" step="0.5" placeholder="0">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Stress Score (0-21)</label>
                        <input type="number" name="stress" class="form-control" min="0" max="21" step="0.5" placeholder="0">
                    </div>
                </div>

                <h3 style="margin-bottom:20px;"><i class="fas fa-sticky-note me-2" style="color:#fbbf24"></i>Clinical Notes</h3>
                <div class="mb-4">
                    <label class="form-label">Notes &amp; Observations</label>
                    <textarea name="notes" class="form-control" rows="4" placeholder="Record clinical observations, progress notes, and recommendations..."></textarea>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="/dashboard" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Save Assessment</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
