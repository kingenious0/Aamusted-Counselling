<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USTED Counselling System - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap-icons.css') }}">
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/inter.css') }}" rel="stylesheet">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#7A0019">
    <!-- PWA & Mobile Optimization -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="AAMUSTED GCC">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #0d6efd, #0a58ca);
            --gold-gradient: linear-gradient(45deg, #0dcaf0, #3d8bfd);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * { box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: white;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated orbs in background */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: float 8s ease-in-out infinite;
            pointer-events: none;
        }
        body::before {
            width: 500px; height: 500px;
            background: #0d6efd;
            top: -100px; left: -100px;
        }
        body::after {
            width: 400px; height: 400px;
            background: #0dcaf0;
            bottom: -100px; right: -100px;
            animation-delay: -4s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 1.5rem;
            animation: fadeInUp 0.7s ease-out;
        }

        /* Logo area */
        .logo-section {
            text-align: center;
            margin-bottom: 2rem;
        }
        .system-logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(13, 110, 253, 0.5));
            transition: transform 0.4s ease;
            margin-bottom: 1.2rem;
        }
        .system-logo:hover { transform: scale(1.05); }

        .logo-section h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0 0 0.25rem;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-section p {
            font-size: 0.88rem;
            color: rgba(255,255,255,0.5);
            margin: 0;
        }

        /* Card */
        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            box-shadow: var(--glass-shadow);
        }

        .login-card h5 {
            font-size: 1rem;
            font-weight: 600;
            color: rgba(255,255,255,0.7);
            text-align: center;
            margin-bottom: 1.8rem;
            letter-spacing: 0.03em;
        }

        /* Inputs */
        .input-group-wrapper {
            position: relative;
            margin-bottom: 1.2rem;
        }
        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.4);
            font-size: 1rem;
            z-index: 2;
            pointer-events: none;
        }
        .form-control {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            border-radius: 12px;
            padding: 14px 14px 14px 42px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            width: 100%;
        }
        .form-control::placeholder { color: rgba(255,255,255,0.3); }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #3d8bfd;
            color: white;
            box-shadow: 0 0 0 3px rgba(61, 139, 253, 0.2);
            outline: none;
        }

        /* Password toggle */
        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.35);
            cursor: pointer;
            font-size: 1rem;
            transition: color 0.2s;
            z-index: 2;
            border: none;
            background: none;
            padding: 0;
        }
        .toggle-password:hover { color: rgba(255,255,255,0.7); }

        /* Submit button */
        .btn-login {
            background: var(--primary-gradient);
            border: none;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            padding: 14px;
            border-radius: 12px;
            width: 100%;
            margin-top: 0.5rem;
            transition: all 0.3s ease;
            letter-spacing: 0.03em;
            cursor: pointer;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(13, 110, 253, 0.5);
            background: linear-gradient(135deg, #3d8bfd, #0d6efd);
        }
        .btn-login:active { transform: translateY(0); }

        /* Loading state */
        .btn-login.loading {
            opacity: 0.8;
            pointer-events: none;
        }

        /* Flash alerts */
        .alert-floating {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1050;
            min-width: 300px;
            animation: slideInRight 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes slideInRight {
            from { transform: translateX(110%); opacity: 0; }
            to   { transform: translateX(0);    opacity: 1; }
        }

        .footer-text {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.78rem;
            color: rgba(255,255,255,0.25);
        }
    </style>
</head>

<body>
    <!-- Flash Messages -->
    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="alert-floating">
        {% for message in messages %}
        <div class="alert alert-danger shadow-lg border-0 d-flex align-items-center mb-2" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-3 fs-5"></i>
            <div>{{ message }}</div>
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <div class="login-wrapper">
        <!-- Logo + Title -->
        <div class="logo-section">
            <img src="{{ url_for('static', filename='aamusted system_logo.png') }}"
                 class="system-logo"
                 onerror="this.style.display='none'">
            <h1>USTED</h1>
            <p>Guidance &amp; Counselling Management System</p>
        </div>

        <!-- Login Card -->
        <div class="login-card">
            <h5><i class="bi bi-shield-lock me-2" style="color:#3d8bfd;"></i>Sign in to your account</h5>

            <form method="POST" action="{{ url_for('login') }}" id="loginForm">
                <!-- Username -->
                <div class="input-group-wrapper">
                    <i class="bi bi-person-fill input-icon"></i>
                    <input type="text"
                           class="form-control"
                           name="username"
                           id="usernameInput"
                           placeholder="Username"
                           autocomplete="username"
                           required>
                </div>

                <!-- Password -->
                <div class="input-group-wrapper">
                    <i class="bi bi-lock-fill input-icon"></i>
                    <input type="password"
                           class="form-control"
                           name="password"
                           id="passwordInput"
                           placeholder="Password"
                           autocomplete="current-password"
                           required>
                    <button type="button" class="toggle-password" id="togglePassword" tabindex="-1">
                        <i class="bi bi-eye-slash" id="toggleIcon"></i>
                    </button>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </button>
            </form>
        </div>

        <div class="footer-text">&copy; 2026 AAMUSTED Counselling System</div>
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script>
        // Password show/hide toggle
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput  = document.getElementById('passwordInput');
        const toggleIcon     = document.getElementById('toggleIcon');

        togglePassword.addEventListener('click', function () {
            const isHidden = passwordInput.type === 'password';
            passwordInput.type = isHidden ? 'text' : 'password';
            toggleIcon.className = isHidden ? 'bi bi-eye' : 'bi bi-eye-slash';
        });

        // Loading state on submit
        document.getElementById('loginForm').addEventListener('submit', function () {
            const btn = document.getElementById('loginBtn');
            btn.classList.add('loading');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';
        });

        // Auto-dismiss flash alerts after 4 seconds
        setTimeout(() => {
            document.querySelectorAll('.alert-floating .alert').forEach(el => {
                el.style.transition = 'opacity 0.5s';
                el.style.opacity = '0';
                setTimeout(() => el.remove(), 500);
            });
        }, 4000);

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</body>

</html>
