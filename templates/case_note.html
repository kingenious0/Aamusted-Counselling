{% set active_page = 'case_note' %}
{% extends 'base.html' %}
{% block title %}Clinical Case Note - AAMUSTED Counselling{% endblock %}
{% block heading %}<i class="fas fa-file-medical me-2" style="color:#a78bfa"></i>Clinical Case Note{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card-dark">
            <form method="POST" action="/case_note">
                <h3 style="margin-bottom:20px;"><i class="fas fa-link me-2" style="color:#60a5fa"></i>Session Link</h3>
                <div class="mb-4">
                    <label class="form-label">Select Session *</label>
                    <select name="session_id" class="form-select" required>
                        <option value="">Choose a session...</option>
                        {% for s in sessions %}
                        <option value="{{ s.id }}">{{ s.student_name }} - {{ s.date }}</option>
                        {% endfor %}
                    </select>
                </div>

                <h3 style="margin-bottom:20px;"><i class="fas fa-notes-medical me-2" style="color:#a78bfa"></i>Clinical Observations</h3>
                <div class="mb-3">
                    <label class="form-label">Session Date *</label>
                    <input type="date" name="session_date" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Appearance &amp; Behavior *</label>
                    <textarea name="appearance" class="form-control" rows="3" required placeholder="Describe dress, grooming, mood, affect, eye contact..."></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Presenting Problems *</label>
                    <textarea name="problems" class="form-control" rows="3" required placeholder="Key concerns, impact on daily life, duration..."></textarea>
                </div>
                <div class="mb-4">
                    <label class="form-label">Clinical Plan *</label>
                    <textarea name="clinical_plan" class="form-control" rows="4" required placeholder="Interventions, recommendations, next steps..."></textarea>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="/case_notes_list" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Save Case Note</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
