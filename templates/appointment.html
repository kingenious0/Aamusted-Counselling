{% set active_page = 'appointment' %}
{% extends 'base.html' %}
{% block title %}Schedule Appointment - AAMUSTED Counselling{% endblock %}
{% block heading %}<i class="fas fa-calendar-plus me-2" style="color:#60a5fa"></i>Schedule Appointment{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card-dark">
            <form method="POST" action="/appointment">
                <h3 style="margin-bottom:20px;"><i class="fas fa-calendar-day me-2" style="color:#60a5fa"></i>Appointment Details</h3>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Student Name *</label>
                        <select name="student_name" class="form-select" required>
                            <option value="">Select Student...</option>
                            {% for student in students %}
                            <option value="{{ student.name }}" data-id="{{ student.id }}">{{ student.name }}{% if student.case_number %} ({{ student.case_number }}){% endif %}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Student ID</label>
                        <input type="text" name="student_id" class="form-control" placeholder="Student ID">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Date *</label>
                        <input type="date" name="date" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Time *</label>
                        <input type="time" name="time" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Type *</label>
                        <select name="type" class="form-select" required>
                            <option value="">Select Type...</option>
                            <option value="Initial">Initial</option>
                            <option value="Follow-up">Follow-up</option>
                            <option value="Crisis">Crisis</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Counsellor *</label>
                        <select name="counsellor" class="form-select" required>
                            <option value="">Select Counsellor...</option>
                            {% for c in counsellors %}
                            <option value="{{ c.name }}">{{ c.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <h3 style="margin-bottom:20px;"><i class="fas fa-sticky-note me-2" style="color:#fbbf24"></i>Notes</h3>
                <div class="mb-4">
                    <label class="form-label">Additional Notes</label>
                    <textarea name="notes" class="form-control" rows="3" placeholder="Any additional information..."></textarea>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="/dashboard" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-calendar-check me-1"></i>Schedule Appointment</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.querySelector('select[name="student_name"]').addEventListener('change', function() {
    var opt = this.options[this.selectedIndex];
    var sidInput = document.querySelector('input[name="student_id"]');
    sidInput.value = opt.dataset.id || '';
});
</script>
{% endblock %}
