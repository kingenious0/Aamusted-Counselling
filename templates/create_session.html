{% set active_page = 'create_session' %}
{% extends 'base.html' %}
{% block title %}Create Session - AAMUSTED Counselling{% endblock %}
{% block heading %}<i class="fas fa-plus-circle me-2" style="color:#4ade80"></i>Create Session{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card-dark">
            <form method="POST" action="/create_session">
                <h3 style="margin-bottom:20px;"><i class="fas fa-notes-medical me-2" style="color:#60a5fa"></i>Session Details</h3>
                <div class="row g-3 mb-4">
                    <div class="col-md-12">
                        <label class="form-label">Student *</label>
                        <select name="student" class="form-select" required>
                            <option value="">Select Student...</option>
                            {% for s in students %}
                            <option value="{{ s.id }}">{{ s.name }} ({{ s.case_number }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Session Type *</label>
                        <select name="session_type" class="form-select" required>
                            <option value="">Select Type...</option>
                            <option value="Individual">Individual Counseling</option>
                            <option value="Group">Group Counseling</option>
                            <option value="Crisis">Crisis Intervention</option>
                            <option value="Academic">Academic Support</option>
                            <option value="Career">Career Guidance</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Date *</label>
                        <input type="date" name="date" class="form-control" required>
                    </div>
                </div>

                <h3 style="margin-bottom:20px;"><i class="fas fa-file-medical me-2" style="color:#a78bfa"></i>Clinical Notes</h3>
                <div class="mb-3">
                    <label class="form-label">Session Notes *</label>
                    <textarea name="notes" class="form-control" rows="4" required placeholder="Enter session notes, observations, and key discussion points..."></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Diagnosis / Assessment</label>
                    <textarea name="diagnosis" class="form-control" rows="3" placeholder="Clinical assessment or diagnosis..."></textarea>
                </div>
                <div class="mb-4">
                    <label class="form-label">Treatment Plan</label>
                    <textarea name="plan" class="form-control" rows="3" placeholder="Proposed treatment plan and next steps..."></textarea>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="/dashboard" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Save Session</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
