{% set active_page = 'referral' %}
{% extends 'base.html' %}
{% block title %}New Referral - AAMUSTED Counselling{% endblock %}
{% block heading %}<i class="fas fa-share-square me-2" style="color:#f87171"></i>New Referral{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card-dark">
            <form method="POST" action="/referral">
                <h3 style="margin-bottom:20px;"><i class="fas fa-user-tag me-2" style="color:#f87171"></i>Referral Information</h3>
                <div class="row g-3 mb-4">
                    <div class="col-md-12">
                        <label class="form-label">Student *</label>
                        <select name="student" class="form-select" required>
                            <option value="">Select Student...</option>
                            {% for s in students %}
                            <option value="{{ s.id }}">{{ s.name }} ({{ s.case_number }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Referred By *</label>
                        <input type="text" name="referred_by" class="form-control" required placeholder="Name or department">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Contact *</label>
                        <input type="text" name="contact" class="form-control" required placeholder="Phone or email">
                    </div>
                </div>

                <h3 style="margin-bottom:20px;"><i class="fas fa-exclamation-triangle me-2" style="color:#fbbf24"></i>Reason &amp; Details</h3>
                <div class="mb-3">
                    <label class="form-label">Reason for Referral *</label>
                    <textarea name="reason" class="form-control" rows="3" required placeholder="Describe the reason for this referral..."></textarea>
                </div>
                <div class="mb-4">
                    <label class="form-label">Additional Notes</label>
                    <textarea name="notes" class="form-control" rows="3" placeholder="Any additional information or clinical notes..."></textarea>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="/all_referrals" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane me-1"></i>Submit Referral</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
